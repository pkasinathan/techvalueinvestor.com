<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tech Value Investor">
  <rect width="64" height="64" rx="14" fill="#0A0D10"/>
  <!-- Three candles stepping up: the brand is value plus markets, so the mark
       is a price series rather than a monogram. -->
  <g fill="#00D68F">
    <rect x="13" y="34" width="8" height="17" rx="2"/>
    <rect x="28" y="24" width="8" height="27" rx="2"/>
    <rect x="43" y="13" width="8" height="38" rx="2"/>
  </g>
  <g stroke="#00D68F" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M17 28v6"/>
    <path d="M32 17v7"/>
    <path d="M47 8v5"/>
  </g>
</svg>
